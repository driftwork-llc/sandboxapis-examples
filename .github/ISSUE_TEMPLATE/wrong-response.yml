name: Wrong response
description: A response that does not match what the real provider returns
title: "Wrong response: "
labels: ["conformance"]
body:
  - type: markdown
    attributes:
      value: |
        An exact mirror is the whole point: same paths, same JSON structure, same
        headers, same status codes, same error shapes. A difference is a bug, so
        thank you for writing it up. If the endpoint returns a 404 with an
        `X-SandboxAPIs-Coverage` header it is not served yet, and the
        [coverage request](?template=coverage-request.yml) form is the right one.
  - type: input
    id: provider
    attributes:
      label: Provider
      placeholder: Jira
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Host you called
      description: The live host, or the pinned snapshot host if you used one.
      placeholder: jira-v3-g12.snap.sandboxapis.dev
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: The request
      description: A curl command we can run is ideal.
      render: shell
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What came back
      description: Status, headers and body.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What the real API returns instead
      description: >
        A quote from the provider's own documentation, or a captured response from
        a real account with anything private taken out.
      render: text
    validations:
      required: true
